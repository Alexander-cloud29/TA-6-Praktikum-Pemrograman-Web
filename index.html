<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#121212', 
                    }
                }
            }
        }
    </script>
    <style>
        .weather-bg {
            transition: background-color 1s ease, background-image 1s ease;
        }

        body:not(.dark) {
            color: #263238;
        }
        
        .day-sunny { background-image: linear-gradient(to top right, #E0F7FA, #B3E5FC); }
        .day-cloudy { background-image: linear-gradient(to top, #ECEFF1, #CFD8DC); }
        .rainy { background-image: linear-gradient(to top, #B0BEC5, #78909C); }
        .stormy { background-image: linear-gradient(to top, #546E7A, #37474F); }

        .dark .weather-bg {
            background-color: #121212 !important;
            background-image: none !important;
            color: #E0E0E0;
        }
        
        .dark .text-white { color: #E0E0E0; }
        .dark .text-white\/70, .dark .text-white\/80 { color: #A0A0A0; }
        
        .dark h1 {
            color: #FFFFFF;
        }

        .dark #app, .dark .bg-white\/10 {
            background-color: #1E1E1E;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .dark .hover\:bg-white\/20:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .dark .hover\:bg-white\/10:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .dark input#cityInput {
            background-color: #282828;
            color: #E0E0E0;
            border: none;
        }
        .dark .placeholder-white\/70 { color: #A0A0A0; }
        .dark input#cityInput:focus {
            border-color: #64B5F6;
            box-shadow: 0 0 0 2px rgba(100, 181, 246, 0.5);
        }

        .dark #autocompleteSuggestions {
            background-color: #282828;
        }
        .dark #autocompleteSuggestions div {
            color: #E0E0E0;
            border-color: #383838;
        }
        .dark #autocompleteSuggestions div:hover {
            background-color: #383838;
        }

        .dark button.text-black { color: #E0E0E0; }
        .dark button.bg-white { background-color: #424242; }
        .dark #refreshBtn {
            background-color: #282828;
            color: #E0E0E0;
        }
        .dark #refreshBtn:hover {
            background-color: #383838;
        }
        .dark #themeToggle {
            color: #A0A0A0;
        }
        .dark #themeToggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .skeleton {
            animation: pulse 1.5s infinite;
            background-color: rgba(0, 0, 0, 0.1); 
            border-radius: 0.25rem;
        }
        .dark .skeleton {
            background-color: rgba(255, 255, 255, 0.1); 
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes subtle-move {
            0% { transform: translateY(0); }
            5ٹوں% { transform: translateY(-2px); }
            100% { transform: translateY(0); }
        }
        .animate-icon {
            animation: subtle-move 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="weather-bg day-sunny min-h-screen p-4 transition-colors duration-500">

    <div id="app" class="max-w-4xl mx-auto backdrop-blur-md bg-white/10 p-6 rounded-3xl shadow-2xl transition-colors duration-500">

        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold tracking-wider">XelaWeather</h1>
            <div class="flex space-x-4 items-center">
                
                <button id="themeToggle" class="p-2 rounded-full hover:bg-white/20 dark:hover:bg-white/10 transition duration-300 dark:text-gray-200">
                    <svg id="moonIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg id="sunIcon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>
                
                <div class="flex items-center bg-white/20 dark:bg-white/10 rounded-full p-1">
                    <button id="celsiusBtn" class="px-3 py-1 rounded-full bg-white text-black font-semibold text-sm transition-all duration-300">°C</button>
                    <button id="fahrenheitBtn" class="px-3 py-1 rounded-full text-white/80 font-semibold text-sm hover:bg-white/10 transition-all duration-300">°F</button>
                </div>
            </div>
        </header>

        <div class="mb-8 relative">
            <input type="text" id="cityInput" placeholder="Cari kota..." 
                    class="w-full p-3 rounded-xl bg-white/20 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-300 transition duration-300 shadow-lg"
                    onkeydown="if(event.key === 'Enter') fetchWeather(document.getElementById('cityInput').value)">
                    
            <div id="autocompleteSuggestions" class="absolute z-10 w-full mt-2 bg-white/95 rounded-xl shadow-xl hidden text-sm overflow-hidden border border-gray-300">
            </div>
        </div>

        <section id="favoritesSection" class="mb-8">
            <h3 class="text-xl font-semibold mb-3 border-b border-white/30 dark:border-gray-600 pb-1 text-left dark:text-gray-200">Kota Favorit</h3>
            <div id="favoriteList" class="flex flex-wrap gap-2 text-sm text-left">
            </div>
        </section>

        <section class="mb-10 text-center dark:text-gray-200">
            
            <div class="flex justify-center items-center mb-2">
                <h2 id="locationDisplay" class="text-5xl font-light loading-text mr-4">...</h2>
                <button id="favoriteToggle" class="text-3xl hover:opacity-75 transition duration-200" title="Tambah ke Favorit">
                </button>
            </div>
            
            <p id="currentTimeDisplay" class="text-xl font-medium mb-1 loading-text">Memuat waktu...</p> 
            <p id="timestampDisplay" class="text-gray-600 dark:text-gray-400 mb-6 loading-text">Data Diperbarui: --</p>
            
            <div id="currentWeatherContainer" class="flex flex-col items-center loading-skeleton">
                <div id="weatherIcon" class="text-9xl animate-icon"></div> 
                <p id="weatherCondition" class="text-3xl font-semibold mt-2 mb-4 loading-text">Memuat Kondisi</p>

                <div class="relative inline-block">
                    <span id="temperatureDisplay" class="text-8xl font-extrabold loading-text">--</span>
                    <span class="absolute top-0 right-[-30px] text-4xl font-light degree-unit">°C</span>
                </div>
            </div>
            
            <div class="flex justify-center space-x-8 mt-8 text-lg font-light">
                <p>Kelembapan: <span id="humidityDisplay" class="font-medium loading-text">--%</span></p>
                <p>Angin: <span id="windSpeedDisplay" class="font-medium loading-text">-- m/s</span></p>
            </div>
        </section>

        <section>
            <h3 class="text-2xl font-semibold mb-4 border-b border-white/30 dark:border-gray-600 pb-2 dark:text-gray-200">Prakiraan 5 Hari</h3>
            <div id="forecastContainer" class="grid grid-cols-2 md:grid-cols-5 gap-4">
                <div class="p-4 rounded-xl bg-white/10 dark:bg-gray-800/50 skeleton h-32"></div>
                <div class="p-4 rounded-xl bg-white/10 dark:bg-gray-800/50 skeleton h-32 hidden md:block"></div>
                <div class="p-4 rounded-xl bg-white/10 dark:bg-gray-800/50 skeleton h-32 hidden md:block"></div>
                <div class="p-4 rounded-xl bg-white/10 dark:bg-gray-800/50 skeleton h-32 hidden md:block"></div>
                <div class="p-4 rounded-xl bg-white/10 dark:bg-gray-800/50 skeleton h-32 hidden md:block"></div>
            </div>
        </section>

        <div class="text-center mt-8">
             <button id="refreshBtn" class="px-6 py-2 bg-white/20 dark:bg-gray-700/50 rounded-full font-semibold hover:bg-white/30 dark:hover:bg-gray-600/50 transition duration-300 flex items-center mx-auto dark:text-gray-200">
                <svg id="refreshIcon" class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 19m9.643 4H20m0 0v-5m0 5l-2.414-2.414"></path></svg>
                Perbarui Sekarang
            </button>
        </div>

    </div>

    <script>
        const API_KEY = '0569ea2fec813f4fc3509020fc5e5d64';
        const BASE_URL_WEATHER = 'https://api.openweathermap.org/data/2.5/weather';
        const BASE_URL_FORECAST = 'https://api.openweathermap.org/data/2.5/forecast';
        const BASE_URL_GEO = 'https://api.openweathermap.org/geo/1.0/direct'; 

        let currentCity = 'Bandar Lampung, ID'; 
        let isCelsius = true; 
        let isDarkMode = false; 

        const body = document.body;
        const locationDisplay = document.getElementById('locationDisplay');
        const timestampDisplay = document.getElementById('timestampDisplay');
        const weatherIcon = document.getElementById('weatherIcon');
        const weatherCondition = document.getElementById('weatherCondition');
        const temperatureDisplay = document.getElementById('temperatureDisplay');
        const humidityDisplay = document.getElementById('humidityDisplay');
        const windSpeedDisplay = document.getElementById('windSpeedDisplay');
        const forecastContainer = document.getElementById('forecastContainer');
        const refreshBtn = document.getElementById('refreshBtn');
        const celsiusBtn = document.getElementById('celsiusBtn');
        const fahrenheitBtn = document.getElementById('fahrenheitBtn');
        const degreeUnit = document.querySelector('.degree-unit');
        const cityInput = document.getElementById('cityInput');
        const autocompleteSuggestions = document.getElementById('autocompleteSuggestions');
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const currentTimeDisplay = document.getElementById('currentTimeDisplay');
        
        const favoriteToggle = document.getElementById('favoriteToggle');
        const favoriteList = document.getElementById('favoriteList');

        const weatherIcons = {
            Clear: '☀️', Clouds: '☁️', Rain: '🌧️', Drizzle: '☔',
            Thunderstorm: '⛈️', Snow: '❄️', Mist: '🌫️', Haze: '🌫️',
            Fog: '🌫️', Atmosphere: '🌫️'
        };

        const weatherThemes = {
            Clear: 'day-sunny', Clouds: 'day-cloudy', Rain: 'rainy', Drizzle: 'rainy',
            Thunderstorm: 'stormy', Snow: 'day-cloudy', Mist: 'day-cloudy', 
            Smoke: 'day-cloudy', Haze: 'day-cloudy', Fog: 'day-cloudy', 
            Atmosphere: 'day-cloudy'
        };

        function getIcon(condition) {
            return weatherIcons[condition] || '❓';
        }
        function getTheme(condition) {
            return weatherThemes[condition] || 'day-sunny'; 
        }

        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                const context = this;
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(context, args), delay);
            };
        }

        function loadFavorites() {
            try {
                const favorites = localStorage.getItem('favoriteCities');
                return favorites ? JSON.parse(favorites) : [];
            } catch (e) {
                console.error("Could not load favorites from localStorage", e);
                return [];
            }
        }

        function saveFavorites(favorites) {
            try {
                localStorage.setItem('favoriteCities', JSON.stringify(favorites));
            } catch (e) {
                console.error("Could not save favorites to localStorage", e);
            }
        }

        function isFavorite(city) {
            const favorites = loadFavorites();
            return favorites.includes(city);
        }

        function toggleFavorite() {
            const cityToToggle = currentCity;
            let favorites = loadFavorites();

            if (isFavorite(cityToToggle)) {
                favorites = favorites.filter(c => c !== cityToToggle);
                favoriteToggle.innerHTML = '☆'; 
                favoriteToggle.classList.remove('text-yellow-400');
            } else {
                favorites.push(cityToToggle);
                favoriteToggle.innerHTML = '⭐'; 
                favoriteToggle.classList.add('text-yellow-400');
            }

            saveFavorites(favorites);
            renderFavoriteList();
        }

        function renderFavoriteList() {
            const favorites = loadFavorites();
            favoriteList.innerHTML = '';

            if (favorites.length === 0) {
                favoriteList.innerHTML = '<p id="noFavorites" class="text-gray-600 dark:text-gray-400">Belum ada kota favorit.</p>';
                return;
            }

            favorites.forEach(city => {
                const button = document.createElement('button');
                const cityNameForSearch = city.split(',')[0].trim(); 
                
                button.className = 'px-4 py-1 bg-gray-200 text-gray-800 rounded-full text-sm hover:bg-gray-300 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600 transition duration-200';
                button.textContent = city;
                
                button.addEventListener('click', () => {
                    fetchWeather(cityNameForSearch);
                });
                
                favoriteList.appendChild(button);
            });
        }
        
        async function searchCities(query) {
            if (query.length < 3) {
                autocompleteSuggestions.classList.add('hidden');
                return;
            }
            
            const url = `${BASE_URL_GEO}?q=${query}&limit=5&appid=${API_KEY}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                renderSuggestions(data);
            } catch (error) {
                console.error('Error fetching city suggestions:', error);
            }
        }

        function renderSuggestions(cities) {
            autocompleteSuggestions.innerHTML = '';
            if (cities.length === 0) {
                autocompleteSuggestions.classList.add('hidden');
                return;
            }

            cities.forEach(city => {
                const state = city.state ? city.state + ', ' : '';
                const displayFullName = `${city.name}, ${state}${city.country}`;
                
                const item = document.createElement('div');
                item.className = 'p-3 cursor-pointer hover:bg-gray-700/80 transition duration-150 border-b border-gray-700/50 last:border-b-0 dark:hover:bg-gray-700';
                item.textContent = displayFullName;
                
                item.dataset.cityname = city.name; 

                item.addEventListener('click', () => {
                    cityInput.value = displayFullName;
                    autocompleteSuggestions.classList.add('hidden');
                    fetchWeather(item.dataset.cityname); 
                });
                autocompleteSuggestions.appendChild(item);
            });

            autocompleteSuggestions.classList.remove('hidden');
        }
        
        function updateCurrentTime() {
            const now = new Date();
            const currentTimeString = now.toLocaleTimeString('id-ID', {
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit'
            });
            const currentDateString = now.toLocaleDateString('id-ID', {
                weekday: 'long', 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric'
            });

            if (currentTimeDisplay) {
                currentTimeDisplay.textContent = `${currentTimeString} - ${currentDateString}`;
            }
        }

        async function fetchWeather(city) {
            showLoading();

            try {
                const weatherUrl = `${BASE_URL_WEATHER}?q=${city}&appid=${API_KEY}&units=metric`;
                const weatherResponse = await fetch(weatherUrl);
                if (!weatherResponse.ok) throw new Error('Kota tidak ditemukan atau API Error');
                const weatherData = await weatherResponse.json();

                currentCity = `${weatherData.name}, ${weatherData.sys.country}`;

                const forecastUrl = `${BASE_URL_FORECAST}?q=${weatherData.name}&appid=${API_KEY}&units=metric`;
                const forecastResponse = await fetch(forecastUrl);
                const forecastData = await forecastResponse.json();

                renderCurrentWeather(weatherData);
                renderForecast(forecastData);
                hideLoading();
                
                const condition = weatherData.weather[0].main;
                applyTheme(condition);

            } catch (error) {
                console.error('Error fetching weather data:', error);
                locationDisplay.textContent = '❌ ERROR';
                weatherCondition.textContent = error.message;
                hideLoading(true);
            }
        }

        function renderCurrentWeather(data) {
            const mainTemp = data.main.temp;
            const condition = data.weather[0].main;

            locationDisplay.textContent = currentCity;
            weatherIcon.textContent = getIcon(condition);
            weatherCondition.textContent = data.weather[0].description.replace(/\b\w/g, l => l.toUpperCase());

            temperatureDisplay.dataset.celsius = mainTemp.toFixed(0);
            temperatureDisplay.dataset.fahrenheit = ((mainTemp * 9/5) + 32).toFixed(0);
            updateTemperatureDisplay(); 

            humidityDisplay.textContent = `${data.main.humidity}%`;
            windSpeedDisplay.textContent = `${data.wind.speed.toFixed(1)} m/s`;
            
            const date = new Date(data.dt * 1000);
            timestampDisplay.textContent = `Data Diperbarui: ${date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}`;
            
            if (isFavorite(currentCity)) {
                favoriteToggle.innerHTML = '⭐';
                favoriteToggle.classList.add('text-yellow-400');
            } else {
                favoriteToggle.innerHTML = '☆';
                favoriteToggle.classList.remove('text-yellow-400');
            }
        }

        function renderForecast(data) {
            forecastContainer.innerHTML = '';
            const dailyForecasts = {};
            const today = new Date().toDateString();

            data.list.forEach(item => {
                const date = new Date(item.dt * 1000);
                const day = date.toDateString();

                if (day !== today) {
                    if (!dailyForecasts[day]) {
                        dailyForecasts[day] = {
                            temps: [],
                            condition: item.weather[0].main,
                            description: item.weather[0].description
                        };
                    }
                    dailyForecasts[day].temps.push(item.main.temp);
                }
            });

            Object.keys(dailyForecasts).slice(0, 5).forEach(dayKey => {
                const dayData = dailyForecasts[dayKey];
                const temps = dayData.temps;
                const minTemp = Math.min(...temps);
                const maxTemp = Math.max(...temps);
                const dayName = new Date(dayKey).toLocaleDateString('id-ID', { weekday: 'short' });
                
                const card = document.createElement('div');
                card.className = 'p-3 rounded-xl bg-white/10 dark:bg-white/5 hover:bg-white/20 dark:hover:bg-white/10 transition duration-300 transform hover:scale-105 text-center shadow-lg';
                
                card.dataset.minC = minTemp.toFixed(0);
                card.dataset.maxC = maxTemp.toFixed(0);
                card.dataset.minF = ((minTemp * 9/5) + 32).toFixed(0);
                card.dataset.maxF = ((maxTemp * 9/5) + 32).toFixed(0);

                card.innerHTML = `
                    <p class="font-bold text-lg">${dayName}</p>
                    <div class="text-3xl my-1">${getIcon(dayData.condition)}</div>
                    <p class="text-sm text-gray-700 dark:text-gray-400">${dayData.description}</p>
                    <p class="font-semibold mt-2 text-base">
                        <span class="forecast-min">${isCelsius ? card.dataset.minC : card.dataset.minF}</span>° | 
                        <span class="forecast-max">${isCelsius ? card.dataset.maxC : card.dataset.maxF}</span>°
                    </p>
                `;
                forecastContainer.appendChild(card);
            });
        }

        function updateTemperatureDisplay() {
            const currentTempElement = temperatureDisplay;
            const unitText = isCelsius ? '°C' : '°F';
            const tempValue = isCelsius ? currentTempElement.dataset.celsius : currentTempElement.dataset.fahrenheit;

            currentTempElement.style.transition = 'opacity 0.3s ease';
            currentTempElement.style.opacity = 0;
            
            setTimeout(() => {
                currentTempElement.textContent = tempValue;
                degreeUnit.textContent = unitText;
                currentTempElement.style.opacity = 1;
            }, 300);

            document.querySelectorAll('#forecastContainer > div').forEach(card => {
                const minTempSpan = card.querySelector('.forecast-min');
                const maxTempSpan = card.querySelector('.forecast-max');
                if (minTempSpan && maxTempSpan) {
                    minTempSpan.textContent = isCelsius ? card.dataset.minC : card.dataset.minF;
                    maxTempSpan.textContent = isCelsius ? card.dataset.maxC : card.dataset.maxF;
                }
            });

            celsiusBtn.classList.toggle('bg-white', isCelsius);
            celsiusBtn.classList.toggle('text-black', isCelsius);
            celsiusBtn.classList.toggle('text-white/80', !isCelsius);
            celsiusBtn.classList.toggle('bg-transparent', !isCelsius);

            fahrenheitBtn.classList.toggle('bg-white', !isCelsius);
            fahrenheitBtn.classList.toggle('text-black', !isCelsius);
            fahrenheitBtn.classList.toggle('text-white/80', isCelsius);
            fahrenheitBtn.classList.toggle('bg-transparent', isCelsius);
        }

        celsiusBtn.addEventListener('click', () => {
            if (!isCelsius) {
                isCelsius = true;
                updateTemperatureDisplay();
            }
        });

        fahrenheitBtn.addEventListener('click', () => {
            if (isCelsius) {
                isCelsius = false;
                updateTemperatureDisplay();
            }
        });

        refreshBtn.addEventListener('click', () => {
            refreshIcon.classList.add('animate-spin');
            const cityQuery = currentCity.split(',')[0].trim();
            fetchWeather(cityQuery).finally(() => {
                setTimeout(() => refreshIcon.classList.remove('animate-spin'), 500);
            });
        });

        function applyTheme(condition) {
            const newTheme = getTheme(condition.split(' ')[0]);
            
            body.classList.remove(...Object.values(weatherThemes));
            
            if (!isDarkMode) {
                body.classList.add(newTheme);
            }
        }

        themeToggle.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            
            body.classList.toggle('dark', isDarkMode); 
            
            sunIcon.classList.toggle('hidden', !isDarkMode);
            moonIcon.classList.toggle('hidden', isDarkMode);

            const condition = weatherCondition.textContent.split(' ')[0] || 'Clear'; 
            applyTheme(condition);
        });
        
        function showLoading() {
            document.querySelectorAll('.loading-text').forEach(el => el.textContent = '...');
            document.getElementById('currentWeatherContainer').style.opacity = 0.3;
            forecastContainer.innerHTML = `
                <div class="p-4 rounded-xl bg-white/10 dark:bg-gray-800/50 skeleton h-32"></div>
                <div class="p-4 rounded-xl bg-white/10 dark:bg-gray-800/50 skeleton h-32 hidden md:block"></div>
                <div class="p-4 rounded-xl bg-white/10 dark:bg-gray-800/50 skeleton h-32 hidden md:block"></div>
                <div class="p-4 rounded-xl bg-white/10 dark:bg-gray-800/50 skeleton h-32 hidden md:block"></div>
                <div class="p-4 rounded-xl bg-white/10 dark:bg-gray-800/50 skeleton h-32 hidden md:block"></div>
            `;
        }

        function hideLoading(isError = false) {
             document.getElementById('currentWeatherContainer').style.opacity = 1;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                isDarkMode = true;
                body.classList.add('dark');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                isDarkMode = false;
                body.classList.remove('dark');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
            
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            
            renderFavoriteList();
            const initialCityQuery = currentCity.split(',')[0].trim();
            fetchWeather(initialCityQuery); 

            cityInput.addEventListener('input', debounce(e => {
                searchCities(e.target.value);
            }, 500)); 

            document.addEventListener('click', (e) => {
                if (!cityInput.contains(e.target) && !autocompleteSuggestions.contains(e.target)) {
                    autocompleteSuggestions.classList.add('hidden');
                }
            });
            
            favoriteToggle.addEventListener('click', toggleFavorite);

            setInterval(() => {
                console.log('Auto-refreshing data...');
                const cityQuery = currentCity.split(',')[0].trim();
                fetchWeather(cityQuery);
            }, 300000);
        });
    </script>
</body>
